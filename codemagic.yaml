workflows:
  ios-testflight:
    name: idrak iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic Key

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.sjmlabs.idrak"
        APPLE_TEAM_ID: "G87T5A359Y"
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Set up keychain
        script: keychain initialize

      - name: Create distribution certificate
        script: |
          set -e
          mkdir -p /tmp/certs

          # Generate fresh private key
          openssl genrsa -out /tmp/key.pem 2048

          # Generate CSR
          openssl req -new -key /tmp/key.pem -out /tmp/cert.csr \
            -subj "/CN=Apple Distribution/O=SJM Labs Ltd/C=SA"

          # Create the distribution certificate in Apple's portal
          app-store-connect certificates create \
            --type IOS_DISTRIBUTION \
            --certificate-signing-request @file:/tmp/cert.csr \
            --save \
            --certificates-dir /tmp/certs/

          # Find the downloaded certificate
          CERT_FILE=$(ls /tmp/certs/*.cer 2>/dev/null | head -1)
          echo "Certificate file: $CERT_FILE"

          # Convert DER → PEM
          openssl x509 -inform DER -in "$CERT_FILE" -out /tmp/cert.pem

          # Bundle into .p12
          openssl pkcs12 -export \
            -out /tmp/signing.p12 \
            -inkey /tmp/key.pem \
            -in /tmp/cert.pem \
            -passout pass:codemagic

          # Import .p12 into keychain
          security import /tmp/signing.p12 \
            -k ~/Library/Keychains/codemagic.keychain-db \
            -P "codemagic" \
            -T /usr/bin/codesign \
            -T /usr/bin/productbuild

          # Allow codesign to access without UI prompt
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "" ~/Library/Keychains/codemagic.keychain-db

      - name: Fetch provisioning profile
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Use provisioning profiles
        script: xcode-project use-profiles

      - name: Build Flutter iOS (no codesign)
        script: |
          flutter build ios --release --no-codesign \
            --build-name=1.0.0 \
            --build-number=$(($(date +%s)))

      - name: Archive with Xcode
        script: |
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/Runner.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            archive

      - name: Export IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --archive-path build/Runner.xcarchive

      - name: Publish to TestFlight
        script: |
          IPA=$(find build/ios/ipa -name "*.ipa" | head -1)
          if [ -z "$IPA" ]; then
            echo "No IPA found"
            exit 1
          fi
          app-store-connect publish --path "$IPA"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
