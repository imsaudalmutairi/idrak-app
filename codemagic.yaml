workflows:
  ios-testflight:
    name: idrak iOS -> TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic Key

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - ios-signing
      vars:
        BUNDLE_ID: "com.sjmlabs.idrak"
        APPLE_TEAM_ID: "G87T5A359Y"
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Set up keychain
        script: keychain initialize

      - name: Import distribution certificate
        script: |
          echo "$CM_CERTIFICATE" | base64 --decode > /tmp/certificate.p12
          keychain add-certificates \
            --certificate /tmp/certificate.p12 \
            --certificate-password "$CM_CERTIFICATE_PASSWORD"

      - name: Create provisioning profile
        script: |
          set -e
          # Get the bundle ID resource ID from Apple
          BUNDLE_ID_RES=$(app-store-connect bundle-ids list \
            --identifier "$BUNDLE_ID" \
            --platform IOS \
            --json \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['id'])")
          echo "Bundle ID resource: $BUNDLE_ID_RES"

          # Create App Store profile using our specific certificate
          app-store-connect profiles create \
            --name "idrak_AppStore" \
            --type IOS_APP_STORE \
            --bundle-id "$BUNDLE_ID_RES" \
            --certificate TXWGCHGYY3 \
            --save

          xcode-project use-profiles

      - name: Build Flutter iOS (no codesign)
        script: |
          flutter build ios --release --no-codesign \
            --build-name=1.0.0 \
            --build-number=$(($(date +%s)))

      - name: Archive with Xcode
        script: |
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/Runner.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            archive

      - name: Export IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --archive-path build/Runner.xcarchive

      - name: Publish to TestFlight
        script: |
          IPA=$(find build/ios/ipa -name "*.ipa" | head -1)
          if [ -z "$IPA" ]; then
            echo "No IPA found"
            exit 1
          fi
          app-store-connect publish --path "$IPA"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
