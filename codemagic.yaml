workflows:
  ios-testflight:
    name: idrak iOS -> TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic Key

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - ios-signing
      vars:
        BUNDLE_ID: "com.sjmlabs.idrak"
        APPLE_TEAM_ID: "G87T5A359Y"
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Set up keychain
        script: keychain initialize

      - name: Import distribution certificate
        script: |
          echo "$CM_CERTIFICATE" | base64 --decode > /tmp/certificate.p12
          keychain add-certificates \
            --certificate /tmp/certificate.p12 \
            --certificate-password "$CM_CERTIFICATE_PASSWORD"

      - name: Create provisioning profile
        script: |
          set -e
          # Look up the bundle ID resource ID from Apple
          RAW_BUNDLE=$(app-store-connect bundle-ids list \
            --bundle-id-identifier "$BUNDLE_ID" \
            --platform IOS \
            --print-format json)
          echo "Bundle IDs raw: $RAW_BUNDLE"

          BUNDLE_ID_RES=$(echo "$RAW_BUNDLE" | python3 -c "
import sys, json
d = json.loads(sys.stdin.read())
if isinstance(d, list):
    print(d[0]['id'])
elif isinstance(d, dict) and 'data' in d:
    print(d['data'][0]['id'])
else:
    raise ValueError('Unexpected format: ' + str(type(d)))
")
          echo "Bundle ID resource: $BUNDLE_ID_RES"

          # Delete any existing profiles for this bundle to avoid name conflicts
          app-store-connect profiles list \
            --profile-type IOS_APP_STORE \
            --print-format json 2>/dev/null \
          | python3 -c "
import sys, json
d = json.loads(sys.stdin.read())
items = d if isinstance(d, list) else d.get('data', [])
for item in items:
    bid = (item.get('relationships', {}).get('bundleId', {}).get('data') or {}).get('id', '')
    if bid == sys.argv[1]:
        print(item['id'])
" "$BUNDLE_ID_RES" \
          | xargs -I{} app-store-connect profiles delete {} 2>/dev/null || true

          # Create App Store profile using our specific certificate
          app-store-connect profiles create \
            --name "idrak_AppStore" \
            --type IOS_APP_STORE \
            --bundle-id "$BUNDLE_ID_RES" \
            --certificate TXWGCHGYY3 \
            --save

          xcode-project use-profiles

      - name: Build Flutter iOS (no codesign)
        script: |
          flutter build ios --release --no-codesign \
            --build-name=1.0.0 \
            --build-number=$(($(date +%s)))

      - name: Archive with Xcode
        script: |
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/Runner.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            archive

      - name: Export IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --archive-path build/Runner.xcarchive

      - name: Publish to TestFlight
        script: |
          IPA=$(find build/ios/ipa -name "*.ipa" | head -1)
          if [ -z "$IPA" ]; then
            echo "No IPA found"
            exit 1
          fi
          app-store-connect publish --path "$IPA"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
