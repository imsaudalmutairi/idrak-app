      - name: Build Flutter iOS (no codesign)
        script: |
          flutter build ios --release --no-codesign \
            --build-name=1.0.0 \
            --build-number=$(($(date +%s)))

      - name: Archive with Xcode
        script: |
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/Runner.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="idrak_AppStore" \
            archive

      - name: Export IPA
        script: |
          python3 -c "import plistlib,pathlib; pathlib.Path('/tmp/ExportOptions.plist').write_bytes(plistlib.dumps({'method':'app-store','teamID':'G87T5A359Y','signingStyle':'manual','provisioningProfiles':{'com.sjmlabs.idrak':'idrak_AppStore'},'uploadBitcode':False,'uploadSymbols':True}))"
          mkdir -p build/ios/ipa
          xcodebuild -exportArchive \
            -archivePath build/Runner.xcarchive \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath build/ios/ipa

      - name: Publish to TestFlight
        script: |
          IPA=$(find build/ios/ipa -name "*.ipa" | head -1)
          if [ -z "$IPA" ]; then
            echo "No IPA found"
            exit 1
          fi
          app-store-connect publish --path "$IPA"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
